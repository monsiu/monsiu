name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # Regenerate the cards daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # PROFILE_CARDS_TOKEN is a token with `read:user` scope. That scope is required so
          # the profile-details banner and the aggregate stats card can be generated (both
          # query the user's email field, which the default GITHUB_TOKEN cannot read). If this
          # secret is ever removed, fall back to: GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # (the other three cards still generate, but those two will be skipped).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          # Nairobi, Kenya is UTC+3 (EAT) so the productive-time card is accurate
          UTC_OFFSET: 3
