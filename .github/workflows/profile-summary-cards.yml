name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # Regenerate the cards daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # A personal token is required: the default GITHUB_TOKEN is a GitHub App
          # installation token and cannot read the user-level GraphQL data that the
          # profile-details and stats cards need ("Resource not accessible by integration").
          GITHUB_TOKEN: ${{ secrets.PROFILE_CARDS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          # Nairobi, Kenya is UTC+3 (EAT) so the productive-time card is accurate
          UTC_OFFSET: 3
