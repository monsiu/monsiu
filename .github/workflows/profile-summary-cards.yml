name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # Regenerate the cards daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # The default GITHUB_TOKEN generates the repos-per-language, most-commit-language
          # and productive-time cards fine. To ALSO generate the profile-details banner and
          # the aggregate stats card, create a PAT with `read:user` scope (those cards query
          # your email field), add it as a repo secret named PROFILE_CARDS_TOKEN, and change
          # the line below to: GITHUB_TOKEN: ${{ secrets.PROFILE_CARDS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          # Nairobi, Kenya is UTC+3 (EAT) so the productive-time card is accurate
          UTC_OFFSET: 3
